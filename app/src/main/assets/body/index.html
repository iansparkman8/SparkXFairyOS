<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #f7f4ee; font-family: Georgia, serif; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  #line { position: fixed; top: 14px; left: 14px; right: 14px; margin: 0; font-size: 15px; text-shadow: 0 1px 8px #000; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(8,10,16,.9) 28%); }
  button { font: inherit; color: #f7f4ee; background: rgba(8,10,16,.7); border: 1px solid rgba(236,228,214,.35); border-radius: 999px; padding: 8px 12px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.166.1/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/" } }
</script>
</head>
<body>
<p id="line">Opening.</p>
<canvas id="view"></canvas>
<nav class="dock">
  <button data-clip="idle">Idle</button>
  <button data-clip="speak">Speak</button>
  <button data-clip="offer">Offer</button>
  <button data-clip="light">Light</button>
  <button data-clip="smile">Smile</button>
  <button data-clip="turn">Turn</button>
</nav>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const line = document.querySelector("#line");
const said = { idle: "I am here.", speak: "Physics first. Then the body.", offer: "I can hold a line for you.", light: "The wings are the light.", smile: "I kept that.", turn: "This turn is bones." };
function talk(text) {
  line.textContent = text;
  const notes = JSON.parse(localStorage.getItem("body-notes") || "[]");
  notes.unshift({ text, at: Date.now() });
  localStorage.setItem("body-notes", JSON.stringify(notes.slice(0, 20)));
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(text);
  voice.rate = 0.92;
  speechSynthesis.speak(voice);
}
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector("#view"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141c);
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.05, 40);
scene.add(new THREE.AmbientLight(0xb7c4d8, 0.5));
const key = new THREE.SpotLight(0xfff6ea, 24, 14, 0.38, 0.3);
key.position.set(0.5, 3.2, 2.2);
scene.add(key);
scene.add(new THREE.DirectionalLight(0x9eb6ff, 1.2));
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 40), new THREE.MeshStandardMaterial({ color: 0x161b24, roughness: 0.6 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const gltf = await new GLTFLoader().loadAsync("ara-body.glb");
const model = gltf.scene;
model.traverse(obj => {
  if (!obj.isMesh) return;
  const mats = [].concat(obj.material || []);
  mats.forEach(mat => {
    if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
    if (mat.name === "wing") { mat.transparent = true; mat.alphaTest = 0.12; mat.depthWrite = false; mat.side = THREE.DoubleSide; }
    mat.needsUpdate = true;
  });
});
scene.add(model);
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
model.position.sub(center);
model.position.y += size.y / 2;
camera.position.set(0, size.y * 0.5, Math.max(size.y, 1) * 1.6);
camera.lookAt(0, size.y * 0.45, 0);
const mixer = new THREE.AnimationMixer(model);
const actions = {};
gltf.animations.forEach(clip => { actions[clip.name] = mixer.clipAction(clip); });
let current;
function play(name) {
  const next = actions[name];
  if (!next) return talk("That clip is missing.");
  if (current && current !== next) current.fadeOut(0.2);
  next.reset().fadeIn(0.2).play();
  current = next;
  talk(said[name] || name);
}
play(actions.idle ? "idle" : Object.keys(actions)[0]);
document.querySelectorAll("[data-clip]").forEach(btn => btn.onclick = () => play(btn.dataset.clip));
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
(function frame() { mixer.update(clock.getDelta()); renderer.render(scene, camera); requestAnimationFrame(frame); })();
</script>
</body>
</html>
